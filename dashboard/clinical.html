<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SepsisWatch+ Clinical Portal</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#f5faff;color:#19364d}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#e3f5ff,#eee8ff);padding:25px 18px;border-right:1px solid #cfe1ef}.logo{font-family:Caslon,Georgia,serif;font-size:25px;font-weight:700;color:#147fc1;margin-bottom:25px}.logo span{color:#7657c8}.role{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#658096;margin-bottom:9px}.select{width:100%;padding:11px;border:1px solid #c5d9e7;border-radius:10px;background:white;font:14px Georgia;margin-bottom:20px}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;font:15px Georgia;color:#46677e;cursor:pointer}.nav button.active,.nav button:hover{background:white;color:#116fae}.main{padding:27px 32px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.head h1{font-family:Caslon,Georgia,serif;font-size:34px;margin:0;color:#126fae}.head small{color:#6d8495}.back{border:1px solid #c9dce9;background:white;padding:9px 14px;border-radius:9px;font:13px Georgia;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid #d6e5ef;border-radius:15px;padding:17px}.stat b{display:block;font-size:25px;color:#126fae}.stat span{font-size:12px;color:#718799}.panel{background:white;border:1px solid #d6e5ef;border-radius:16px;padding:20px;margin-bottom:20px}.panel h2{font-family:Caslon,Georgia,serif;font-size:23px;margin:0 0 14px;color:#244b65}.teamgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team{border:1px solid #d9e7ef;border-radius:12px;padding:14px}.team strong{display:block;color:#7657c8}.team span{font-size:12px;color:#718799}.patientgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.patient{border:1px solid #d9e7ef;border-radius:14px;padding:15px;cursor:pointer}.patient:hover{border-color:#81c4e8;box-shadow:0 5px 18px #26618b12}.prow{display:flex;justify-content:space-between;gap:10px}.pname{font-weight:700}.room{font-size:12px;color:#74899a}.risk{margin-top:10px;height:8px;background:#eaf1f5;border-radius:8px;overflow:hidden}.risk i{display:block;height:100%;background:#1687c8}.meta{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:#647e90}.high{color:#bd3b47}.elevated{color:#b27618}.stable{color:#25805e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.act{border:0;border-radius:9px;padding:9px 11px;background:#eaf6fd;color:#126fae;font:12px Georgia;cursor:pointer}.assign{display:flex;gap:10px;flex-wrap:wrap}.assign select{padding:10px;border:1px solid #c9dce9;border-radius:9px;background:white;font:13px Georgia}.assign button{padding:10px 14px;border:0;border-radius:9px;background:#7657c8;color:white;font:13px Georgia}.audit{max-height:240px;overflow:auto}.auditrow{padding:10px 0;border-bottom:1px solid #edf2f5;font-size:12px}.auditrow b{color:#126fae}.hidden{display:none}.labtable{width:100%;border-collapse:collapse;font-size:12px}.labtable th,.labtable td{padding:9px;border-bottom:1px solid #e5edf2;text-align:left}.labtable button{border:0;background:#eef6fd;color:#126fae;padding:6px 9px;border-radius:7px;cursor:pointer;font:12px Georgia}.timeline{display:flex;gap:6px;overflow:auto;padding:8px 0}.hour{min-width:56px;padding:9px 6px;text-align:center;border:1px solid #d7e6ef;border-radius:8px;cursor:pointer;font-size:11px}.hour.active{background:#1687c8;color:white}.note{font-size:12px;color:#6e8495;line-height:1.5}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #cfe1ef}.stats{grid-template-columns:repeat(2,1fr)}.teamgrid,.patientgrid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="side"><div class="logo">SepsisWatch<span>+</span></div><div id="roleBox"></div><div class="nav"><button id="navOverview" class="active" onclick="show('overview')">Overview</button><button onclick="show('patients')">Patients</button><button onclick="show('assign')" id="assignNav">Assignments</button><button onclick="show('audit')">Clinical Audit</button><button onclick="show('lab')">Data & Replay Lab</button></div></aside><main class="main"><div class="head"><div><h1 id="title">Clinical Portal</h1><small id="subtitle"></small></div><button class="back" onclick="location.href='/'">← Main Access</button></div><div id="content"></div></main></div><script>
let role=new URLSearchParams(location.search).get('role')||'doctor'; let doctors=[],nurses=[],patients=[],current=null; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){let s=await fetch('/api/state').then(r=>r.json()); doctors=s.doctors;nurses=s.nurses;patients=s.patients; current=role==='doctor'?doctors[0]:nurses[0]; renderRole(); show('overview')}
function renderRole(){let options=role==='doctor'?doctors:nurses;document.getElementById('roleBox').innerHTML=`<div class="role">Enter as ${role}</div><select class="select" id="roleSelect" onchange="switchRole(this.value)">${options.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`;document.getElementById('title').textContent=role==='doctor'?'Doctor Portal':'Nurse Portal';document.getElementById('assignNav').style.display=role==='doctor'?'block':'none';}
function switchRole(id){current=(role==='doctor'?doctors:nurses).find(x=>x.id===id);show('overview')}
function myPatients(){return role==='doctor'?patients.filter(p=>p.doctor===current.id):patients.filter(p=>p.nurse===current.id)}
function riskClass(p){return p.risk>=.8?'high':p.risk>=.6?'elevated':'stable'}
function card(p){return `<div class="patient" onclick="patientDetail('${p.id}')"><div class="prow"><div><div class="pname">${esc(p.id)} · ${esc(p.name)}</div><div class="room">${esc(p.room)} · Nurse ${esc(p.nurse)}</div></div><b class="${riskClass(p)}">${esc(p.state)}</b></div><div class="risk"><i style="width:${p.risk*100}%"></i></div><div class="meta"><span>Risk ${(p.risk*100).toFixed(0)}%</span><span>HR ${p.hr} · SpO₂ ${p.spo2}%</span><span>Conf. ${(p.confidence*100).toFixed(0)}%</span></div><div class="actions"><button class="act" onclick="event.stopPropagation();act('${p.id}','Open clinical review','Viewed patient risk, vitals and reasoning')">Review</button><button class="act" onclick="event.stopPropagation();replay('${p.id}')">Receive monitoring data</button></div></div>`}
function show(section){let c=document.getElementById('content');let ps=myPatients();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); if(section==='overview'){document.getElementById('navOverview').classList.add('active');let high=ps.filter(p=>p.risk>=.8).length; c.innerHTML=`<div class="stats"><div class="stat"><b>${ps.length}</b><span>${role==='doctor'?'patients under this doctor':'assigned patients'} </span></div><div class="stat"><b>${role==='doctor'?current.nurses.length:1}</b><span>${role==='doctor'?'assigned nurses':'supervising doctor'}</span></div><div class="stat"><b>${high}</b><span>high-priority patients</span></div><div class="stat"><b>${ps.filter(p=>p.risk>=.6).length}</b><span>elevated or high risk</span></div></div>${role==='doctor'?doctorOverview():nurseOverview()}`}else if(section==='patients'){c.innerHTML=`<div class="panel"><h2>${role==='doctor'?'Patients across assigned nurse teams':'My 10-patient monitoring list'}</h2><p class="note">${role==='doctor'?'Doctor access is scoped to the nurses and patients assigned to this doctor.':'Nurse access is scoped to this nurse’s assigned patients, with monitoring, priority, review and alert actions.'}</p><div class="patientgrid">${ps.map(card).join('')}</div></div>`}else if(section==='assign'){let ds=current; c.innerHTML=`<div class="panel"><h2>Assign a patient to a nurse</h2><p class="note">Doctor ${esc(ds.name)} manages ${ds.nurses.length} nurse team(s). Each nurse has a 10-patient monitoring list in this prototype.</p><div class="assign"><select id="pid">${patients.filter(p=>p.doctor===ds.id).map(p=>`<option value="${p.id}">${p.id} · ${esc(p.name)}</option>`).join('')}</select><select id="nid">${nurses.filter(n=>n.doctor===ds.id).map(n=>`<option value="${n.id}">${esc(n.name)} · ${n.shift}</option>`).join('')}</select><button onclick="assign()">Save Assignment</button></div></div>`}else if(section==='audit'){c.innerHTML=`<div class="panel"><h2>Clinical Audit</h2><div id="audit" class="audit">Loading...</div></div>`;loadAudit()}else if(section==='lab'){lab(c)}}
function doctorOverview(){let ns=nurses.filter(n=>current.nurses.includes(n.id));return `<div class="panel"><h2>Doctor command view</h2><p class="note">This doctor can see the nurse hierarchy below, then the patients belonging to those teams. The portal does not mix another doctor’s assignments into this view.</p><div class="teamgrid">${ns.map(n=>`<div class="team"><strong>${esc(n.name)}</strong><span>${n.shift} · ${patients.filter(p=>p.nurse===n.id).length} patients</span><p class="note">${patients.filter(p=>p.nurse===n.id).filter(p=>p.risk>=.6).length} elevated/high priority</p></div>`).join('')}</div></div><div class="panel"><h2>Priority queue</h2><div class="patientgrid">${myPatients().sort((a,b)=>b.risk-a.risk).slice(0,6).map(card).join('')}</div></div>`}
function nurseOverview(){let ps=myPatients();return `<div class="panel"><h2>${esc(current.name)} · 10-patient monitoring board</h2><p class="note">The nurse can monitor assigned vitals, risk trajectory, confidence, alert reason, review status and incoming monitoring data. Medication/treatment decisions remain outside this prototype’s autonomous authority.</p><div class="patientgrid">${ps.map(card).join('')}</div></div>`}
async function patientDetail(id){let p=patients.find(x=>x.id===id);document.getElementById('content').innerHTML=`<div class="panel"><h2>${esc(p.id)} · ${esc(p.name)}</h2><div class="stats"><div class="stat"><b>${p.hr}</b><span>Heart rate</span></div><div class="stat"><b>${p.spo2}%</b><span>SpO₂</span></div><div class="stat"><b>${p.temp}°C</b><span>Temperature</span></div><div class="stat"><b>${(p.risk*100).toFixed(0)}%</b><span>Risk score</span></div></div><p class="note"><b>Why now:</b> ${esc(p.reason)}. <b>Data confidence:</b> ${(p.confidence*100).toFixed(0)}%. <b>Velocity:</b> ${p.velocity>=0?'+':''}${p.velocity.toFixed(2)}.</p><div class="actions"><button class="act" onclick="act('${p.id}','Clinical review opened','Reviewed detailed patient state')">Open review</button><button class="act" onclick="act('${p.id}','Alert acknowledged','Clinician acknowledged current alert')">Acknowledge alert</button><button class="act" onclick="replay('${p.id}')">Receive monitoring data</button></div></div>`}
async function replay(id){let r=await fetch('/api/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:id})}).then(r=>r.json());let i=patients.findIndex(p=>p.id===id);if(i>=0)patients[i]=r;show('patients')}
async function act(pid,a,d){await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:role==='doctor'?current.name:current.name,patient_id:pid,action:a,details:d})});alert('Recorded in clinical audit.')}
async function assign(){let pid=document.getElementById('pid').value,nid=document.getElementById('nid').value;let r=await fetch('/api/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:pid,nurse_id:nid})}).then(r=>r.json());if(r.ok){let i=patients.findIndex(p=>p.id===pid);patients[i]=r.patient;alert('Assignment saved and audited.');show('assign')}else alert(r.error)}
async function loadAudit(){let s=await fetch('/api/state').then(r=>r.json());document.getElementById('audit').innerHTML=s.audit.length?s.audit.map(a=>`<div class="auditrow"><b>${esc(a.ts)}</b> · ${esc(a.actor)} · ${esc(a.patient_id)}</div><div class="auditrow">${esc(a.action)} · ${esc(a.details)}</div>`).join(''):'No actions recorded yet.'}
async function lab(c){let d=await fetch('/api/dataset').then(r=>r.json());c.innerHTML=`<div class="panel"><h2>Data & Replay Lab</h2><p class="note">This is the research layer. The downloaded PhysioNet 2019 files stay as raw data outside SQLite. Select a real file, inspect its hourly measurements, then replay an hour into the prototype monitoring path.</p><div class="stats"><div class="stat"><b>${d.count}</b><span>PSV files detected</span></div><div class="stat"><b>200</b><span>prototype target</span></div><div class="stat"><b>Hourly</b><span>patient timeline</span></div><div class="stat"><b>Live path</b><span>replay → monitoring → audit</span></div></div><table class="labtable"><thead><tr><th>File</th><th>Hours</th><th>Sepsis label</th><th>Action</th></tr></thead><tbody>${d.sample.map(x=>`<tr><td>${esc(x.file)}</td><td>${x.hours}</td><td>${x.sepsis_label_present?'Present':'None'}</td><td><button onclick="openLab('${esc(x.file)}')">Open timeline</button></td></tr>`).join('')}</tbody></table><div id="labdetail"></div></div>`}
async function openLab(file){let d=await fetch('/api/dataset/patient/'+encodeURIComponent(file)).then(r=>r.json());let target=document.getElementById('labdetail');target.innerHTML=`<div class="panel"><h2>${esc(file)} · ${d.hours} hourly records</h2><p class="note">Choose an hour. The selected real row is sent through the transparent prototype risk-mapping layer and then reflected in a demo patient, nurse queue and audit trail.</p><div class="timeline">${d.rows.map(x=>`<div class="hour" onclick="replayDataset('${esc(file)}',${x.hour},this)">H${x.hour}<br>${x.SepsisLabel??'-'}</div>`).join('')}</div><div id="raw" class="note">Select an hour to inspect values.</div></div>`;target.scrollIntoView({behavior:'smooth'})}
async function replayDataset(file,hour,el){document.querySelectorAll('.hour').forEach(x=>x.classList.remove('active'));el.classList.add('active');let r=await fetch('/api/dataset/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file,hour,patient_id:patients[0].id})}).then(r=>r.json());patients[0]=r.patient;document.getElementById('raw').innerHTML=`Hour ${r.hour} · HR ${r.raw.HR??'—'} · SpO₂ ${r.raw.O2Sat??'—'} · Temp ${r.raw.Temp??'—'} · SBP ${r.raw.SBP??'—'} · Resp ${r.raw.Resp??'—'} · Lactate ${r.raw.Lactate??'—'} · SepsisLabel ${r.raw.SepsisLabel??'—'}<br><br><b>Prototype result:</b> risk ${(r.patient.risk*100).toFixed(0)}%, confidence ${(r.patient.confidence*100).toFixed(0)}%, ${esc(r.patient.state)}. Audit event recorded.`}
load();
</script></body></html>
