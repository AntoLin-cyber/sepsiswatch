<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SepsisWatch+ Patient</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#19364d;background:radial-gradient(circle at 15% 0,#dff5ff,transparent 35%),radial-gradient(circle at 90% 90%,#eadfff,transparent 35%),#f7fbff}.wrap{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cfe1ef;padding:12px 0}.logo{font-family:Caslon,Georgia,serif;font-size:27px;font-weight:700;color:#147fc1}.logo span{color:#7657c8}.back{border:1px solid #c8dbe8;background:white;border-radius:9px;padding:9px 13px;font:13px Georgia}.selector{margin:25px 0;background:white;border:1px solid #d5e4ee;border-radius:14px;padding:16px}.selector select{padding:10px;border:1px solid #c9dce9;border-radius:9px;font:14px Georgia}.hero{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:stretch}.bandbox,.desktop{background:white;border:1px solid #d5e4ee;border-radius:20px;padding:24px;box-shadow:0 14px 35px #1d587c10}.bandbox h2,.desktop h2{font-family:Caslon,Georgia,serif;margin:0 0 8px;color:#126fae}.band{height:300px;border-radius:80px;max-width:170px;margin:25px auto;position:relative;background:linear-gradient(180deg,#a9dff7 0 32%,#1687c8 32% 68%,#a9dff7 68%);box-shadow:inset 0 0 0 9px #d6eef9,0 10px 25px #166b981c;display:flex;align-items:center;justify-content:center}.screen{width:116px;height:125px;background:#102f46;border-radius:20px;padding:13px;color:#dff7ff;text-align:center;box-shadow:0 0 0 4px #bce7fa}.screen .big{font-size:30px;font-weight:bold;color:white}.screen .small{font-size:10px;margin:4px 0}.live{font-size:12px;color:#2b8b68;text-align:center}.desktop p,.note{color:#667f91;line-height:1.5;font-size:13px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.tile{border:1px solid #d8e6ee;border-radius:12px;padding:15px}.tile b{font-size:24px;color:#126fae}.tile span{display:block;font-size:11px;color:#708798;margin-top:4px}.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.node{padding:11px 13px;border-radius:11px;background:#edf7fd;border:1px solid #d4e7f2;font-size:12px;color:#41677d}.arrow{color:#7657c8}.section{margin-top:22px;background:white;border:1px solid #d5e4ee;border-radius:18px;padding:21px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1687c8;color:white;font:13px Georgia;cursor:pointer}.purple{background:#7657c8}.green{background:#24946b}.history{margin-top:15px;max-height:170px;overflow:auto;font-size:12px}.row{padding:9px 0;border-bottom:1px solid #edf2f5}.badge{display:inline-block;padding:5px 8px;border-radius:15px;background:#eef7fd;font-size:11px;color:#4d7187}
@media(max-width:850px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">SepsisWatch<span>+</span></div><button class="back" onclick="location.href='/'">← Main Access</button></div><div class="selector"><b>Patient profile</b> <select id="patientSelect" onchange="loadPatient(this.value)"></select> <span class="badge">Patient-facing view</span></div><div id="app"></div></div><script>
let patients=[];let selected;
async function init(){let s=await fetch('/api/state').then(r=>r.json());patients=s.patients;let sel=document.getElementById('patientSelect');sel.innerHTML=patients.slice(0,6).map(p=>`<option value="${p.id}">${p.id} · ${p.name}</option>`).join('');loadPatient(sel.value)}
async function loadPatient(id){selected=await fetch('/api/patient/'+id).then(r=>r.json());render()}
function render(){let p=selected.patient,n=selected.nurse,d=selected.doctor;document.getElementById('app').innerHTML=`<div class="hero"><section class="bandbox"><h2>Connected 3D Smart Band</h2><p class="note">The patient’s wearable is the primary live sensor source in this prototype. Monitoring values appear directly on the band screen.</p><div class="band"><div class="screen"><div class="small">LIVE</div><div class="big">${p.hr}</div><div class="small">BPM</div><div class="small">SpO₂ ${p.spo2}%</div><div class="small">Temp ${p.temp}°C</div><div class="small">Risk ${(p.risk*100).toFixed(0)}%</div></div></div><div class="live">● Wearable connection simulated · data stream active</div></section><section class="desktop"><h2>Patient Desktop App</h2><p>This is what the patient can access from the app. It focuses on personal monitoring, trends, wearable status, alerts, and care-team visibility, not clinician-only controls.</p><div class="tiles"><div class="tile"><b>${p.hr}</b><span>Heart rate</span></div><div class="tile"><b>${p.spo2}%</b><span>SpO₂</span></div><div class="tile"><b>${p.temp}°C</b><span>Temperature</span></div><div class="tile"><b>${(p.risk*100).toFixed(0)}%</b><span>Monitoring risk</span></div></div><div class="flow"><span class="node">Smart Band</span><span class="arrow">→</span><span class="node">Patient App</span><span class="arrow">→</span><span class="node">Monitoring API</span><span class="arrow">→</span><span class="node">Nurse Queue</span><span class="arrow">→</span><span class="node">Doctor Review</span></div><p><b>Care team:</b> ${n.name} · ${d.name}. <b>Current state:</b> ${p.state}. <b>Reason:</b> ${p.reason}.</p><div class="actions"><button class="btn" onclick="receive()">Receive new monitoring data</button><button class="btn purple" onclick="notify()">View care-team status</button></div></section></div><section class="section"><h2>What the patient can access</h2><div class="tiles"><div class="tile"><b>Vitals</b><span>HR, SpO₂, temperature, blood pressure and respiration</span></div><div class="tile"><b>Trends</b><span>Personal risk and measurement history</span></div><div class="tile"><b>Alerts</b><span>Patient-facing notification status</span></div><div class="tile"><b>Team</b><span>Assigned nurse and supervising doctor</span></div></div><div id="history" class="history"></div></section></div>`}
async function receive(){let r=await fetch('/api/replay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:selected.patient.id})}).then(r=>r.json());selected.patient=r;render();document.getElementById('history').innerHTML='<div class="row"><b>New monitoring data received.</b> Wearable stream updated and event sent to the clinical monitoring path.</div>'+(document.getElementById('history').innerHTML||'')}
function notify(){alert(`Care team: ${selected.nurse.name} · ${selected.doctor.name}`)}init();
</script></body></html>
